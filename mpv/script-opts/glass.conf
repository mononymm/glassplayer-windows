# Glass settings for mpv  (goes in  %APPDATA%\mpv\script-opts\glass.conf)
# Edit a value, save, then restart mpv. Anything left out uses the default shown here.

# ---------------------------------------------------------------- look
# Overall size. Windows display scaling is applied on top automatically.
scale=1.0
# Font (must be installed in Windows; Inter looks best, Segoe UI works too)
font=Inter
# Colors as RRGGBB (no #)
accent=F0302C
text=F5F6F8
muted=9AA0AE
# Glass tint and how solid it is (0 = clear, 1 = solid)
tint=14161C
glass_opacity=0.55
glow=yes
glow_strength=1.0

# ---------------------------------------------------------------- behaviour
fade_in=90
fade_out=160
# How long the controls stay after the mouse stops moving (ms)
hide_timeout=900
show_when_paused=yes
click_to_pause=yes
double_click_fullscreen=yes
# Playlist: no = floating card over the video, yes = shrink the video to make room
playlist_push_video=no
playlist_width=340
wheel_volume_step=5

# ---------------------------------------------------------------- library page (when no video is open)
# Sections separated by ;  name a section with Name=  and combine folders with |
# Example:  library_folders=Movies=D:\Movies|E:\More Movies;Shows=F:\Shows;Anime=F:\Anime
# Leave empty to use your Videos folder.
library_folders=
# How many shows/movies to remember in Continue watching
history_size=24

# ---------------------------------------------------------------- Plex (optional, read-only)
# Path to Plex's library database. Replace YOUR-USER with the Windows account that runs Plex.
# Leave empty to turn Plex features off (titles, posters, resume points from Plex).
plex_db=
#plex_db=C:\Users\YOUR-USER\AppData\Local\Plex Media Server\Plug-in Support\Databases\com.plexapp.plugins.library.db
plex_sqlite=C:\Program Files\Plex\Plex Media Server\Plex SQLite.exe
# 1 = the server owner's account
plex_account=1
# Past this fraction of the runtime counts as watched (Plex uses 90% too)
watched_at=0.90

# ---------------------------------------------------------------- sync progress back to Plex (optional)
# Shared folder where mpv leaves progress for the GlassSync script (empty = no sync)
sync_folder=C:\Users\Public\GlassSync
# yes only on the Windows account that runs Plex: sends progress right away instead of waiting
# for the scheduled sync
sync_now=no

# ---------------------------------------------------------------- upscaling (optional)
# Shader files in %APPDATA%\mpv\shaders, separated by commas. Missing files just mean no upscaling.
anime_shaders=ArtCNN_C4F16.glsl,KrigBilateral.glsl,SSimDownscaler.glsl
live_shaders=FSRCNNX_x2_16-0-4-1.glsl,KrigBilateral.glsl,SSimDownscaler.glsl
# A file whose path contains any of these words uses the anime shaders
anime_folders=Anime
