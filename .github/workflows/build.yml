name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/Glass/Glass.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.VERSION }} -o out

      - name: Package the mpv script
        shell: pwsh
        run: Compress-Archive -Path mpv\* -DestinationPath Glass-mpv.zip -Force

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/Glass.exe
            Glass-mpv.zip

      - name: Release notes
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## Changes"
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev"..HEAD
            else
              git log --no-merges --pretty='- %s' -n 15
            fi
            echo
            echo "## Verify your download"
            echo "SHA-256:"
            echo '```'
            (cd out && sha256sum Glass.exe)
            sha256sum Glass-mpv.zip
            echo '```'
            echo "Built by GitHub Actions from commit ${GITHUB_SHA} ([build log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})). Check the signed build certificate with:"
            echo '```'
            echo "gh attestation verify Glass.exe --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "> **Heads-up:** the first time you play something (or after switching upscaling or updating your graphics driver), playback can freeze for a few seconds up to about half a minute while mpv builds its shaders for your GPU. It only happens once; after that they're cached."
            echo
            echo "Download **Glass.exe** and run it (no install). **Glass-mpv.zip** is the mpv interface on its own (see mpv/README.md). Personal project, not made for public use; see the README."
          } > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: Glass-${{ env.VERSION }}
          path: out/Glass.exe

      - name: Remove the old rolling "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag -y || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Glass for Windows ${{ env.VERSION }}
          body_path: notes.md
          make_latest: true
          files: |
            out/Glass.exe
            Glass-mpv.zip
